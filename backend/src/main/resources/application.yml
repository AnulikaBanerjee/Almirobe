spring:
  application:
    name: almirobe-api
  profiles:
    active: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

almirobe:
  cors:
    allowed-origins: http://localhost:5173
  jwt:
    issuer: almirobe
    access-token-ttl: PT15M
    refresh-token-ttl: P7D
    secret: ${JWT_SECRET:change-me-in-production-use-at-least-32-characters}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  otp:
    dev-expose-code: ${OTP_DEV_EXPOSE:true}
  redis:
    enabled: false
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    queue-tags: almirobe:jobs:tags
    queue-extract: almirobe:jobs:extract
    result-prefix: "almirobe:job:"
  storage:
    enabled: false
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    region: us-east-1
    bucket: ${S3_BUCKET:almirobe}
    access-key: ${S3_ACCESS_KEY:almirobe}
    secret-key: ${S3_SECRET_KEY:almirobe-secret}
    presign-ttl: PT15M
  ghost-extract:
    url: ${GHOST_EXTRACT_URL:}
